[project]
name = "agent-harness"
version = "0.1.0"
description = "The harness a support-style agent keeps whatever its domain: typed contracts, the loop, policy positions, approvals and escalation waits, telemetry, state. No agent's domain reaches it."
requires-python = ">=3.12"
# Exactly what the package imports. A provider SDK is here because the `llm`
# module realises one; the import contract in the workspace root keeps every
# other module from knowing it exists.
dependencies = [
    "pydantic>=2.9",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openai>=1.50",
    "pyjwt[crypto]>=2.9",
    "mcp>=1.9",
    "jsonschema>=4.23",
    "psycopg[binary,pool]>=3.2",
    "starlette>=1.6",
    "fastapi>=0.115",
    "temporalio>=1.18",
    # The Entra on-behalf-of exchange (T-099): one form post, asynchronously.
    "httpx2>=2.0",
]

[project.optional-dependencies]
# The Azure stack (T-099): Pydantic AI as the model layer under the `llm` port,
# the Azure Monitor OpenTelemetry distro under `telemetry`, and DBOS under the
# approval and escalation waits. Optional, because a deployment on the Open
# Stack imports none of them; each is imported only by the adapter that needs it.
azure = [
    "pydantic-ai-slim[openai]>=1.0",
    "azure-monitor-opentelemetry>=1.6",
    # Durable waits on the PostgreSQL the stack already runs: approvals and
    # escalations as DBOS workflows (`approvals/dbos.py`, `escalation/dbos.py`).
    "dbos>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]
