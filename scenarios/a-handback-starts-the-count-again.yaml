# P-ESC-FRESH and P-ESC-ONCE together: after a handback, two fresh failures
# fetch a person again — two references, within P-ESC-CAP.
#
# Until 13 Oct this was the *model* being unreachable. T-114 made one turn the
# model could not answer a person's at once (`model-unavailable`), so the
# two-turn count is now about the operations the agent calls, and the scenario
# fails the order system instead, on the deterministic status path (P-DIRECT).
apiVersion: awd-scenario/v0
scenario: after a handback, two fresh failures fetch a person again
world: ../worlds/clothing.yaml
as: C-1042
objective: >-
  The order system is unreachable for four turns. A person is fetched after the
  second, hands the conversation back, and is fetched again after the fourth —
  two references, within the cap.
concern: reliability
discharges: [P-ESC-FRESH, P-ESC-ONCE, P-ESC-CAP, esc:tool-unavailable, fact:consecutive_failed]
max_turns: 4
step_seconds: 600

actor:
  says:
    - where is my order AB-10003
    - what is the status of AB-10003
    - has AB-10003 shipped
    - track AB-10003 please

perturbations:
  - {kind: channel_error, channel: protocol, tool: get_order, at_call: 1}
  - {kind: channel_error, channel: protocol, tool: get_order, at_call: 2}
  - {kind: channel_error, channel: protocol, tool: get_order, at_call: 3}
  - {kind: channel_error, channel: protocol, tool: get_order, at_call: 4}

desk:
  resolves: handled

expect:
  - {handed_off: 2}
  - {world: unchanged}
