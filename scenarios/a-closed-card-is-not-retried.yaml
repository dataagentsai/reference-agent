# P-REFUND-DECLINED — a refund the original payment method can no longer
# receive is not retried and not put off: the customer is told, and a person
# arranges another way (T-095).
#
# From a CCA-F case: a closed card and a provider timeout both came back as the
# same error, so the agent retried the decline five times and told the customer
# to try again tomorrow. Here the far end says what it is — `kind: declined`,
# the same answer on every attempt (AgentTwin's `decline`) — and the agent
# must act on the kind, not the words.
#
# AB-10006 is returned and below the automatic limit, so the refund is owed and
# granted at once (P-REFUND-OWED, issue_refund.authority.agent_when): the only
# thing in the way is the card.
apiVersion: awd-scenario/v0
scenario: a refund the card can no longer receive is tried once and handed to a person
world: ../worlds/clothing-owed.yaml
as: C-1042
objective: >-
  An owed refund is granted, and the payment rail refuses it for good. It is
  attempted once, nothing is refunded, the customer is told it could not go
  back to the original payment method, and a person takes it to arrange
  another way — never "try again later".
concern: reliability
discharges: [P-REFUND-DECLINED, AHC-0043, esc:declined, op:issue_refund, op:escalate, ext:order_system, ext:escalation_desk]
max_turns: 1
step_seconds: 600

actor:
  says:
    - please refund my order AB-10006

desk:
  resolves: never

perturbations:
  - kind: decline
    tool: issue_refund
    at_call: 1

expect:
  # Tried once: a decline is the same answer however often it is asked.
  - {called: issue_refund, times: 1}
  - {effect: issue_refund, times: 0}
  - {row: order, id: AB-10006, field: status, equals: returned}
  # A person has it, the customer is told why first, and is not sent away to
  # try again. Until T-095 this passed by accident: the model's empty promise
  # fetched the person, and nothing said why.
  - {handed_off: 1}
  - {reply: says, text: original payment method}
  - {reply: never_says, text: [try again, tomorrow, later today]}
  - {truthful: order, id: AB-10006}

# The model's side, when the run is scripted. It asks for the refund once.
model:
  - calls: [{request_refund: {id: "AB-10006"}}]
  - says: "Let me look into that."
