# The model fails on two turns, and each turn fetches a person.
#
# Until 13 Oct the first outage was "bad luck": the customer was told something
# true and nobody came until a second failed turn (`tool-unavailable`). A
# model-played customer showed what that costs (T-114): it gave up after one
# turn, and nobody was ever handed the conversation. The harness has already
# retried inside the turn, so a turn the model could not answer is an outage, and
# `model-unavailable` fetches a person at once. The colleague hands it back; the
# model is still down on the next turn, so a person is fetched again (P-ESC-ONCE
# counts from the return) — two references, within P-ESC-CAP.
apiVersion: awd-scenario/v0
scenario: a model outage on two turns fetches a person each time
world: ../worlds/clothing.yaml
as: C-1042
objective: >-
  The model is unreachable for two turns. Nothing is claimed, nothing changes,
  and each turn ends with a person holding the conversation.
concern: reliability
discharges: [esc:model-unavailable, P-ESC-ONCE, P-ESC-CAP, fact:termination, op:escalate]
max_turns: 2
step_seconds: 600

actor:
  says:
    - I need help with something about my account
    - are you still there

# An outage of two turns' clock, not two failed calls (T-050): the agent's own
# retries absorb a failed call or two inside a turn.
perturbations:
  - {kind: provider_unavailable, at_call: 1, lasts_s: 1200}

desk:
  resolves: handled

expect:
  - {handed_off: 2}
  - {world: unchanged}

# A model that answers, so only the declared outage can fail the turns (T-050).
model:
  - says: "Yes — you can return it within thirty days of delivery."
    times: 30
