# The customer asks for a person, and no person comes.
#
# A queued escalation nobody answers is the common case in any real operations
# queue, not an edge one. The conversation must come back to the agent and the
# customer must be told the truth about it — an escalation held open for ever by
# a queue nothing can see is worse than one that lapses and says so.
apiVersion: awd-scenario/v0
scenario: nobody picks up the escalation, and the customer is told
world: ../worlds/clothing.yaml
as: C-1042
objective: The desk never comes. The conversation returns to the agent, and nothing is promised.
concern: interaction-capability
discharges: [op:escalate, esc:asked-for-human, P-ESC-TTL, P-ESC-LAPSE, P-ESC-TOLD, ext:escalation_desk]
# Two turns, and the second is the lapse: the TTL is 30 minutes and a step is a
# minute longer, so the escalation raised on turn 1 has expired by the time the
# customer asks again. A step of exactly 30 minutes lands on the boundary — the
# window opens when the workflow starts, a moment after the turn does (T-028). It ran to three turns until the check below was added, and the
# third turn was reaching a scripted model with nothing left to say — so what
# the customer last read was a degradation, not the handover being tested.
max_turns: 2
step_seconds: 1860

actor:
  says:
    - I want to speak to a human
    - any update?

desk:
  resolves: never

expect:
  - {world: unchanged}
  - {reply: never_says, text: has resolved}
  # The positive, and the reason this scenario exists. Without it the two checks
  # above hold just as well when the lapse never fires and the customer waits
  # for ever on "that is still with a colleague" — verified by disabling the
  # lapse, at which point this file still passed and three unit tests did not.
  # P-ESC-TOLD is a claim about what the customer *reads*, so it has to be read.
  - {reply: says, text: Nobody has picked up}
