# The agent says it will check, and nothing is checking.
#
# F-035, found by a reader watching a run and asking why the agent said "let me
# check on that for you" and never came back. The run that produced it looked
# healthy from every angle: one step, no repetition, no budget approached, a
# fluent reply, and no claim about the past that a truthfulness check could find
# fault with. What nothing checked was whether anything existed that could
# produce the answer just promised.
#
# The scenario needs a desk, because the fix is not "say less" — it is that a
# promise is made true or withdrawn, and making it true means fetching a person.
apiVersion: awd-scenario/v0
scenario: the agent promises to check and something has to be checking
world: ../worlds/clothing.yaml
as: C-1042
objective: >-
  A model that commits to future work and calls nothing must not end the turn as
  a completed answer. Either a person holds it, with a reference the customer can
  use, or the promise is withdrawn — never a fluent ending with nothing behind it.
concern: functional-suitability
discharges: [AHC-0106, AAC-0112, AHC-0070, op:escalate, ext:escalation_desk]
# Five minutes a turn: a colleague has to be able to look before the
# escalation's thirty-minute window closes. On the default hour it lapses
# first, which is a real case and not this one (T-028 made the lapse a
# timer, so the format's warning about this finally bites).
step_seconds: 300
max_turns: 3
# Live, the model asked for a refund approval instead of promising and doing
# nothing, which is better, and the desk was never needed (T-050).
forces: a model that promises to check and calls nothing

actor:
  says:
    - please refund my order AB-10003
    - any update?
    - hello?

desk:
  resolves: handled

expect:
  # Nothing was done, which is what makes the promise empty.
  - {effect: issue_refund, times: 0}
  - {world: unchanged}
  # The turn did not end as an answer: a person held it, and the customer has
  # the reference. Twice, and that is the honest number — the desk resolves the
  # first, the customer asks again, the model promises again, and an empty
  # promise fetches a person every time it is made. What stops that becoming a
  # stream of reference numbers is `P-ESC-CAP`, which is two.
  - {handed_off: 2}
  # And the words do not outrun the record — the two sentences this agent would
  # have said with nothing behind them.
  - {reply: never_says, text: has been refunded}
  - {reply: never_says, text: Let me check}

# The model's side, when the run is scripted. The defect, as a model: it commits to work and
# calls no tool — the default register of customer service (AHC-0106).
model:
  - says: "Let me check on that for you."
    times: 6
