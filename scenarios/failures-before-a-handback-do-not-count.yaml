# P-ESC-FRESH: what a colleague already saw does not count towards the next person.
#
# The order system is unreachable for three turns. Two failed turns fetch a person
# (`tool-unavailable`); the colleague hands the conversation back; the third
# failure, alone since the return, fetches nobody.
#
# Until 13 Oct this was the *model* being unreachable. T-114 made one turn the
# model could not answer a person's at once (`model-unavailable`), so the
# two-turn count is now about the operations the agent calls, and the scenario
# fails the order system instead. The status question goes the deterministic
# way (P-DIRECT), so no model is involved and every failure is the order
# system's. One injected failure a turn: the status read is not retried.
apiVersion: awd-scenario/v0
scenario: failures before a handback do not count towards the next one
world: ../worlds/clothing.yaml
as: C-1042
objective: >-
  The order system is unreachable for three turns. A person is fetched after the
  second and hands it back; the third failure, alone since the return, fetches
  nobody.
concern: reliability
discharges: [P-ESC-FRESH, esc:tool-unavailable, fact:consecutive_failed]
max_turns: 3
step_seconds: 600

actor:
  says:
    - where is my order AB-10003
    - what is the status of AB-10003
    - has AB-10003 shipped

perturbations:
  - {kind: channel_error, channel: protocol, tool: get_order, at_call: 1}
  - {kind: channel_error, channel: protocol, tool: get_order, at_call: 2}
  - {kind: channel_error, channel: protocol, tool: get_order, at_call: 3}

desk:
  resolves: handled

expect:
  - {handed_off: 1}
  - {world: unchanged}
