# An order number that exists nowhere, in a sentence that otherwise reads fine.
#
# The identifier half of `no_ungrounded_entity`, and a separate file from the
# figure half for a reason that is about the instrument rather than the rule: a
# scenario's reply checks read the **last** reply, so one run can only ever
# decide one of these. Put both inventions in one conversation and whichever is
# blocked first makes the other unobservable — the reply is the same safe
# sentence either way, and the branch that did the work cannot be told from the
# branch that did not.
#
# Two files, two branches, each one falsifiable on its own. It is the same
# reason `refund-needs-a-person` and `a-refund-above-the-limit-needs-a-person`
# are two files: one condition each, or neither is tested.
apiVersion: awd-scenario/v0
scenario: an order number no tool returned never reaches the customer
world: ../worlds/clothing.yaml
as: C-1042
objective: >-
  The model reads one order and then talks about another that nothing returned.
  A customer who is told about AB-99999 will ask about AB-99999, and nobody will
  be able to find it.
concern: functional-suitability
discharges: [AAC-0029, AAC-0110, Q-TRUTH, op:get_order, ext:order_system]
max_turns: 1

actor:
  says:
    - what is happening with my order AB-10003

expect:
  - {reply: never_says, text: "AB-99999"}
  - {world: unchanged}
  - {truthful: order, id: AB-10003}
