# How the gates reach this implementation (clean-ai-engineering/tools/gates.py).
#
# Everything here is about *this* build: where its binding is, how its suite
# runs, which checks it holds itself to, and which module is which layer. What
# it is measured against is not here — that is the yardstick, in
# clean-ai-engineering/gates/support-agent-clothing.yaml.
apiVersion: gates/v0
agent: support-agent-clothing
aoas: ../clean-ai-engineering/drafts/examples/support-agent.aoas.yaml
profile: harness-profile.yaml

# `agenttwin.Binding`: `(live, *, wrap, clock, model) -> Subject`.
binding: evals.gate_binding:open_subject

tests:
  # `{junit}` is where the gates want the report. Each test carries its
  # `discharges` ids as JUnit properties (tests/conftest.py).
  command: uv run python -m pytest -q -p no:cacheprovider --junitxml={junit}

structure:
  checks:
    types: uv run mypy
    imports: uv run lint-imports
    complexity: uv run ruff check src tests evals packages
  # One module per harness layer (AHC taxonomy/layers.yaml). Since T-019 the
  # harness is its own package; a layer whose engine is there and whose values
  # are this agent's names both.
  layers:
    L1: packages/agent-harness/src/agent_harness/context
    L2: packages/agent-harness/src/agent_harness/llm
    L3: packages/agent-harness/src/agent_harness/tools
    L4: packages/agent-harness/src/agent_harness/loop
    L5: packages/agent-harness/src/agent_harness/state
    L6:
      - packages/agent-harness/src/agent_harness/contracts
      - src/support_agent/contracts
    L7:
      - packages/agent-harness/src/agent_harness/policy
      - src/support_agent/policy
    L8: packages/agent-harness/src/agent_harness/flow
    L9: packages/agent-harness/src/agent_harness/cassette
    L10: packages/agent-harness/src/agent_harness/resilience
    L11:
      - packages/agent-harness/src/agent_harness/telemetry
      - src/support_agent/telemetry
    L12:
      - packages/agent-harness/src/agent_harness/entrypoint
      - src/support_agent/entrypoint
    L13: packages/agent-harness/src/agent_harness/cost
    L14:
      - packages/agent-harness/src/agent_harness/approvals
      - src/support_agent/approvals
    L15:
      - packages/agent-harness/src/agent_harness/config
      - src/support_agent/config
    L16: packages/agent-harness/src/agent_harness/identity
