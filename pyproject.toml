[project]
name = "support-agent"
version = "0.1.0"
description = "Reference agent for Clean AI Engineering — customer support, built to the AI Harness Catalog's sixteen layers, with no framework."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "openai>=1.50",
    "pyjwt[crypto]>=2.9",  # RS256 verification (T-002): the crypto extra, declared not inherited
    "mcp>=1.9",
    "jsonschema>=4.23",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "psycopg[binary,pool]>=3.2",
    # The P1 edge. Declared rather than inherited: `serve` imports Starlette and
    # `scripts/run_server.py` runs uvicorn, and until now both arrived only as
    # transitive dependencies of `mcp`. A stdio-only MCP transport, or an SDK
    # release that drops them, would have broken the HTTP edge at import time
    # with nothing in this manifest to explain why.
    "starlette>=1.6",
    "uvicorn>=0.52",
    # The reviewer surface only. `/chat` stays hand-wired Starlette: its error
    # contract is pinned by tests (400 where FastAPI answers 422, and a
    # deliberately opaque 401 body), and converting it would buy documentation
    # nobody reads. Six routes with three scopes is where dependency injection
    # and a real integration surface start paying, so that is where it lands.
    "fastapi>=0.115",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = [
    # Extracted to its own repository on 11 Sep 2026. It stays a *dev* dependency
    # and never a runtime one: the import contract below forbids the agent from
    # importing it at all, and a system that can see its own simulator is a
    # system whose results mean nothing.
    "agenttwin",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "allpairspy>=2.5",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.uv.sources]
# A local path while both repositories move together. Switch to a git reference
# once AgentTwin tags a release and CI needs to resolve it without this checkout.
agenttwin = { path = "../agenttwin", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent", "src/order_system"]

[tool.mypy]
# G0.3, check one of three: catch at build time what a test only catches if it
# happens to run the line. Strict, plus the codes that make an escape hatch
# visible: an ignore must name what it ignores, an unused one is an error, and a
# match over a closed set must handle every member.
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined", "exhaustive-match"]
# The deployment script is a composition root too: a required argument it misses
# is the same defect as one `src` misses, and only mypy sees it before a run.
files = ["src/support_agent", "scripts/run_server.py"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "C901", "PLR0912", "PLR0915"]

# G0.3, check three of three: size and complexity ceilings, as a RATCHET. Each
# starts at today's worst value, so nothing can grow from here, and each is
# lowered as the decomposition (G0.4) takes the worst offenders apart. A ceiling
# that failed on day one would block the refactor it exists to guide.
[tool.ruff.lint.mccabe]
max-complexity = 8       # was 14 (serve.build) before G0.4

[tool.ruff.lint.pylint]
max-statements = 24      # was 50 (loop.run) before G0.4
max-branches = 7         # serve, router, policy — was 12 (loop.run)

[tool.ruff.lint.per-file-ignores]
# The ceilings govern the agent. Test tooling — table-driven suites, the
# hand-written world — is exempt, and says so here rather than by raising the
# ceilings for everything.
"tests/**" = ["C901", "PLR0912", "PLR0915"]
"evals/**" = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids a function call in an argument default, and it is right almost
# everywhere: a mutable default evaluated once at definition is a classic bug.
# FastAPI's `Depends`/`Header`/`Path` are the documented exception — the call
# *is* the declaration, and the framework reads it rather than using it as a
# value. Listed by name rather than silenced with `# noqa`, so the exemption is
# one reviewable decision instead of a comment repeated on every route.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Architecture, enforced. See 27-support-agent-arch-design.md.
#
# Arrows point down only. `|` between siblings means they may NOT import each
# other. Modules in (parentheses) are declared but not yet built — remove the
# parentheses as each one lands, so this contract doubles as the build checklist.
#
# `exhaustive = true` means a new module cannot be added without being placed in
# the architecture. That is "no folder without a score", applied to code.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["support_agent", "order_system"]
include_external_packages = true

[[tool.importlinter.contracts]]
# T-002: the far end's check and the agent it checks stay apart. The agent may
# not see the order system's rules, or it could learn to satisfy them rather
# than be held to them; the order system reuses only the token verifier and the
# contracts, as a library, never the agent's loop, tools or approval workflow.
name = "The order system and the agent cannot reach into each other"
type = "forbidden"
source_modules = ["support_agent"]
forbidden_modules = ["order_system"]

[[tool.importlinter.contracts]]
name = "The order system uses the agent only as a library"
type = "forbidden"
source_modules = ["order_system"]
forbidden_modules = [
    "support_agent.approvals",
    "support_agent.entrypoint",
    "support_agent.escalation",
    "support_agent.llm",
    "support_agent.loop",
    "support_agent.serve",
    "support_agent.tools",
]

[[tool.importlinter.contracts]]
name = "Arrows point down"
type = "layers"
containers = ["support_agent"]
layers = [
    "serve | portal",
    "reviewer",
    "entrypoint",
    "router | loop",
    "context | tools | approvals | escalation",
    "binding",
    "llm | state | policy | cost | idempotency | trigger | resilience | flow | identity | cassette",
    "config | telemetry | ui",
    "conformance | contracts",
]
exhaustive = true

[[tool.importlinter.contracts]]
# Fail closed: the whole package is forbidden the SDK, and exactly one module is
# excepted. A new module inherits the ban without anyone remembering to add it.
name = "Only the llm module knows a provider SDK"
type = "forbidden"
source_modules = ["support_agent"]
forbidden_modules = ["openai", "anthropic", "groq"]
ignore_imports = [
    "support_agent.llm -> openai",
    "support_agent.llm.* -> openai",
    "support_agent.llm -> anthropic",
    "support_agent.llm.* -> anthropic",
    "support_agent.llm -> groq",
    "support_agent.llm.* -> groq",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
# A system that can see its own simulator is a system whose results mean nothing.
name = "The agent cannot see its simulator"
type = "forbidden"
source_modules = ["support_agent"]
forbidden_modules = ["agenttwin"]

[[tool.importlinter.contracts]]
name = "Only the tools module speaks MCP"
type = "forbidden"
source_modules = ["support_agent"]
forbidden_modules = ["mcp"]
ignore_imports = ["support_agent.tools -> mcp", "support_agent.tools.* -> mcp"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only state and idempotency touch the database"
type = "forbidden"
source_modules = ["support_agent"]
forbidden_modules = ["psycopg"]
ignore_imports = [
    "support_agent.state -> psycopg",
    "support_agent.state.* -> psycopg",
    "support_agent.idempotency -> psycopg",
    "support_agent.idempotency.* -> psycopg",
]
unmatched_ignore_imports_alerting = "none"
