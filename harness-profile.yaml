# The reference agent's harness profile — its binding, in the catalog's own format.
#
# This is the "binding spec" the family's charter calls ABS, and it turned out
# not to need inventing: AHC already publishes a profile format, and a binding is
# exactly what it holds — which ports are filled by what, which of the catalog's
# decisions this system answered and how, which numbers it chose, and which
# capabilities it knowingly does not meet.
#
#   npm --prefix ../ai-harness-catalog run lint    # validates shape and references
#
# Every answer below is read from the code, not aspired to. Where the profile and
# the Assurance Map disagree, the map wins: it is generated from tests that ran.
apiVersion: harness-profile/v1

# The stack this agent runs on, and everything it inherits from there — T-033.
# Until this line existed the stack file and this file were two copies of one
# decision, and they had drifted: seven bindings disagreed and `workflow` was
# missing here entirely. Below, a port appears only where this agent adds a
# fact the stack cannot know, or leaves the stack on purpose and says why.
#
#   node ../ai-harness-catalog/tools/resolve.js harness-profile.yaml
extends: ../clean-ai-engineering/stacks/open-stack.yaml

subject:
  name: support-agent
  version: "0.1.0"
  repository: https://github.com/dataagentsai/reference-agent
  description: >-
    Customer support for a clothing retailer. A deterministic router answers what
    it can without a model; the rest goes to a bounded loop over an MCP tool
    surface projected from a declared world. Refunds above a limit need a person,
    and every irreversible effect crosses a gate the model cannot talk through.
  archetypes: [A6]

catalog:
  ahc: "0.3.0"
  aac: "0.13.0"

# ---------------------------------------------------------------- decisions
# The eleven decisions the catalog keys on the capabilities this shape owes.
# `source: chosen` means somebody argued it here; `golden-path` means the
# catalog's own resolution was taken as-is and is recorded rather than assumed.
decisions:
  AHC-0001/parse_failure:
    value: fail-typed
    source: chosen
    note: >-
      ModelMalformed is its own type, never retried: the same prompt to the same
      model produced something unreadable, so a retry mostly buys a second bill.
      The no-retry rule is asserted so it cannot drift (F-015).
  AHC-0001/boundary_position:
    value: harness
    source: golden-path
    note: >-
      One parse site, and an import contract makes a second one impossible rather
      than discouraged — only `llm` may import a provider SDK.
  AHC-0001/raw_retention:
    value: operator-only
    source: chosen
    note: >-
      The raw text rides on the typed failure for whoever is paged, and never
      into the customer's reply. Retaining nothing makes a malformed-output
      report unanswerable; retaining it in the reply is the leak.
  AHC-0004/choke_point:
    value: both
    source: golden-path
    note: >-
      The split, written down as the resolution asks (T-029, 2026-09-16). In
      process: retries, backoff and the breaker (they are the seam scenarios
      inject faults through, F-029), the allowlist, and cost per task. The
      LiteLLM proxy: the provider credential, and per-caller keys with a model
      allowlist, rate limit and budget, which must hold for callers this code
      does not control. The proxy's own retries and cooldowns are off, so there
      is one resilience layer.
  AHC-0004/sdk_containment:
    value: import-contract
    source: chosen
    note: lint-imports fails the build when any module but `llm` imports the provider SDK.
  AHC-0004/interface_shape:
    value: own-interface
    source: chosen
    note: >-
      `LLMClient` is this system's shape, not the provider's, which is what let a
      recording, a script and a resilience decorator stand in the same slot.
  AHC-0009/allow_list_scope:
    value: global
    source: golden-path
    note: One tenant, one list, checked at startup so a typo fails the process rather than a turn.
  AHC-0009/withdrawn_model:
    value: fail-at-build
    source: chosen
    note: >-
      A model with no price is a configuration fault raised where the run is
      configured, not three calls in (AHC-0101).
  AHC-0109/summary_provenance:
    value: no-summariser
    source: chosen
    note: >-
      There is no summariser. `context.assembled` orders for cache friendliness
      and then drops whole exchanges from the middle, so every unit in the window
      is text that entered with its own label and kept it. The alternative was
      argued and rejected on the capability's own grounds: a model-written
      summary of a window containing fenced material is untrusted output, and
      getting that wrong launders a planted instruction into the system's own
      voice. Trimming loses the earliest exchange instead, which is a worse
      product and a smaller hole.

  AHC-0057/irreversible_scope:
    value: authority-by-whose
    source: chosen
    note: >-
      Not every irreversible action needs a person here, and the line is not
      reversibility — it is whose authority the effect needs. Moving money out
      of the business is the business's decision and `issue_refund` is gated.
      Cancelling your own unshipped order is yours, and `P-OWNERSHIP` already
      establishes that only the owner reaches it, so the person whose order it
      is has authorised it by asking. A gate there would queue the commonest
      request behind a human with nothing to add, which is the failure the
      capability's own resolution names. The authority sits in the AOAS as
      conditions over declared state and is checked where the action executes,
      so the agent never decides at the time which kind it is looking at.
      Decided 2026-09-12.

  AHC-0019/redaction_point:
    value: before-export
    source: chosen
    note: One redaction function, on the capture path, so no unredacted copy is written anywhere.
  AHC-0019/reversibility:
    value: irreversible
    source: chosen
    note: >-
      Card numbers, emails, phones and key-shaped strings are replaced, not
      tokenised. Reversible redaction is a second secret to hold.
  AHC-0019/eval_path:
    value: same-path
    source: chosen
    note: The eval path exports through the same tracer, so it redacts by construction rather than by remembering to.

# --------------------------------------------------------------- thresholds
# Every number the catalog refuses to publish. These are this agent's, and the
# AOAS states the ones that are also promises to the customer.
thresholds:
  max_steps_per_task: 12
  max_output_tokens: 4096
  max_cost_usd_per_task: 0.50
  max_tool_result_characters: 8000
  max_history_characters: 32000
  max_concurrent_reads: 4
  oscillation_repeat_threshold: 3
  approval_validity_hours: 24
  escalation_queued_ttl_minutes: 30
  escalations_per_conversation: 2
  refund_without_a_person_inr: 10000

# ----------------------------------------------------------------- bindings
# The whole of the stack choice. `x_could_be` is not part of the format: it is
# this repository's own column for G3's stack matrix, recorded while walking the
# ports rather than by walking them twice, and it says who *else* could supply
# this port. `in-house` here is a deliberate position — a framework owns L4, L1
# and L10, which are the layers the catalogs exist to expose.
bindings:
# Every product this agent runs on is named in the stack file, once, and
# inherited — T-033. What is left here is only what the stack cannot know: a
# fact about how *this* agent uses a port, or a reason it left the stack.
#
# `x_could_be` stays with each port: it says which other approaches could fill
# the seam, which is what makes the binding a choice rather than an assumption.
#
# No `approach` or `adapter` appears below. If one did it would either restate
# the stack — a line that silently goes stale when the stack moves — or leave
# it, which the resolver refuses unless the line says why.
  model:
    x_could_be: [framework, gateway]
    x_provider: groq
    x_provider_check: "declared, and checked against the endpoint at startup (T-018)"
    x_gateway: "litellm-proxy in compose.yaml, reached through provider_base_url with the agent's own key (T-029)"
  tool_runtime:
    x_could_be: [framework]
    # The authority each operation requires. Which operations are privileged is
    # the AOAS's business; what the privilege is *called* is this binding's, and
    # it lived in the worlds' `x_binding` until this file existed to hold it.
    x_scopes:
      cancel_order: orders:write
      open_return_request: returns:write
      change_address: orders:write
      issue_refund: refunds:write
  state:        { x_could_be: [framework, cloud-native] }
  workflow:     { x_could_be: [platform] }
  approval:     { x_could_be: [platform] }
  telemetry:    { x_could_be: [platform] }
  policy:       { x_could_be: [gateway, open-source] }
  identity:
    x_could_be: [gateway, cloud-native]
    x_note: "verify-only since T-002: RS256 against the realm JWKS, aud and jti required, customer_id its own admin-set claim"
  secrets:      { x_could_be: [cloud-native] }
  cost_ledger:  { x_could_be: [gateway, platform] }
  channel:
    x_could_be: [platform]
    x_note: "T-026: signed webhook, HMAC-verified contact, a live stored login resumed per turn; handoff with the facts as a private note"
  config:       { x_could_be: [cloud-native] }
  recorder:     { x_could_be: [open-source] }
  trigger:      { x_could_be: [cloud-native] }
  eval_task:    { x_could_be: [platform, open-source] }

# ------------------------------------------------------------ accepted gaps
# Knowingly not met, owned and dated. Not "untested" — see x_untested below,
# which is a different claim and a weaker one.
accepted_gaps:
  - capability: AHC-0109
    reason: >-
      Met vacuously and deliberately: this agent reduces context by dropping
      whole exchanges, never by summarising, so it produces no new text for a
      provenance label to be lost across. That is the capability's own third
      decision taken as written — discarding is the reduction with no laundering
      surface, and is the right default until measurement says otherwise. If a
      summariser is ever added here, this entry is the thing that has to change
      with it, which is why it is recorded rather than left to be noticed.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0015
    reason: The agent does not stream; a completion and abort contract has nothing to govern.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0071
    reason: >-
      One loop, no graph. There are no nodes to give typed edges to, and building
      a topology in order to satisfy a capability about topologies is the failure
      mode this catalog warns about.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0072
    reason: No graph, so there is no topology to inspect as data.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0073
    reason: >-
      No graph. The trajectory is checkpointed per turn (AHC-0044) and an approval
      resumes from it, which is the part of this that a single loop owes.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0098
    reason: >-
      One class of traffic, one entry point. A priority scheme needs a second
      class to separate this one from.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0092
    reason: >-
      Residency is declared absent in the AOAS rather than left out, and there is
      one provider endpoint, so there is no region choice to pin or record.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0028
    reason: >-
      No grader runs in the loop. Judgement with no scenario suite to score it
      against is an opinion that costs a model call, so this is sequenced with
      AgentTwin's scenarios rather than built first (TODO G0.11).
    owner: reference-agent
    review: "2026-11-01"
  - capability: AHC-0029
    reason: >-
      A production turn cannot yet become a dataset row without a translation
      step, which is what makes online evaluation automatable. Owed with the
      same work as AHC-0028.
    owner: reference-agent
    review: "2026-11-01"
  - capability: AHC-0031
    reason: >-
      No metrics are emitted at all — only spans — so every aggregate question is
      answered by aggregating traces, which is the wrong instrument. TODO G0.11.
    owner: reference-agent
    review: "2026-11-01"
  - capability: AHC-0095
    reason: >-
      Policy evaluation has no budget and no timeout path. All five positions are
      now reached (F-027); a rule that hangs still takes the turn with it.
    owner: reference-agent
    review: "2026-11-01"
  - capability: AHC-0075
    reason: >-
      The budget is a per-task ceiling checked as spend accumulates, not an
      allocation divided between the steps ahead of it.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0090
    reason: >-
      No segment labels are attached at the boundary, so evaluation cannot be
      sliced by customer segment. Nothing in the AOAS names a segment yet.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0032
    reason: >-
      Prompt, model and policy are versioned and diffable, and no release process
      restores them together, because this agent is not deployed.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0033
    reason: >-
      No deployment, so there is no artifact serving traffic to compare with the
      one that was assessed. The Build Manifest is the half of this that exists.
    owner: reference-agent
    review: "2026-12-01"
  # T-009, 2026-09-16. Both were listed under x_untested as believed met. Looking
  # for the test that proves each found there is nothing to prove: the in-process
  # half holds and the cross-process half does not exist.
  - capability: AHC-0006
    reason: >-
      One trace per turn in process, and it stops at the process edge. No trace
      context is injected into anything that leaves: a tool call's MCP `_meta`
      carries the session and, for writes, the idempotency key, and never a
      `traceparent`, so the tool server's work cannot attach to the agent's trace.
      Nothing crosses a gateway because there is none (T-018). Closing it is
      `propagate.inject` into `_meta` on the transport and an extract on the
      server, with a test that the server's span has the agent's trace id.
    owner: reference-agent
    review: "2026-12-01"
  - capability: AHC-0026
    reason: >-
      The run id is minted where the turn begins and is required on `agent.turn`,
      `agent.run` and `agent.step` by the span contract, so in-process spans join
      on it. It does not cross a service boundary on its own: it reaches the tool
      server only inside a write's idempotency key, and a read carries no run id
      at all. Same fix as AHC-0006 — the run id rides beside the trace context.
    owner: reference-agent
    review: "2026-12-01"

# `x_` is the format's extension point. These are not accepted gaps: each is
# believed met and **no test names it**, which the Assurance Map reports and this
# records. A capability claimed without evidence is exactly what that map exists
# to prevent, so they are listed rather than quietly counted as met.
#
# Empty since T-009 (2026-09-16). Five of the seven were proved by tests that did
# not name them — AHC-0002, 0004, 0010, 0020, 0036 are tagged now. AHC-0006 and
# AHC-0026 were not met across the process edge and moved to accepted_gaps.
x_untested: []
