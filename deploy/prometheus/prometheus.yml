# Prometheus: holds the agent's numbers and evaluates the rules that page
# (T-055). The rules are in rules/agent.yml; their tests in rules/agent.test.yml,
# run by `promtool test rules` from tests/test_alert_rules.py.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/agent.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # The collector's own counters: what it received, sent, and failed to send.
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
