# The LiteLLM proxy (T-029): the gateway every model call goes through.
#
# `model_name` is what the agent sends, so it is spelled exactly as
# `Settings.approved_models` spells it. Pointing `AGENT_PROVIDER_BASE_URL` here
# then changes the route and nothing the agent says, and the run fingerprint
# does not move (T-018): the provider is declared, and checked at startup
# against what `/model/info` below reports.
model_list:
  - model_name: openai/gpt-oss-120b
    litellm_params: { model: groq/openai/gpt-oss-120b, api_key: os.environ/GROQ_API_KEY }
  - model_name: openai/gpt-oss-20b
    litellm_params: { model: groq/openai/gpt-oss-20b, api_key: os.environ/GROQ_API_KEY }
  - model_name: qwen/qwen3.8-27b
    litellm_params: { model: groq/qwen/qwen3.8-27b, api_key: os.environ/GROQ_API_KEY }

# One resilience layer, and it is in process. `ResilientLLM` retries, backs off
# and breaks the circuit, and it has to stay there because it is the seam
# scenarios inject provider faults through (F-029). So the proxy does none of it:
#
# - no retries: two retry layers on one call multiply, three attempts each is
#   nine requests;
# - no cooldowns: the router's cooldown is a second circuit breaker, and it was
#   worse than redundant. Measured 16 Sep: one failed call put the deployment on
#   cooldown and the next came back as 429 "no deployments available", so a
#   provider refusing a bad key reached the agent as a rate limit, and the agent
#   waited and retried something that could never succeed.
#
# What the gateway owns instead is what must hold for callers the agent does not
# control (AHC-0004's split): the provider credential, and a per-caller key with
# its model allowlist, rate limit and budget. Those live in keys.py.
litellm_settings:
  num_retries: 0
router_settings:
  num_retries: 0
  disable_cooldowns: true
